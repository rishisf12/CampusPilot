<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 220"
  shape-rendering="geometricPrecision"
>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(40, 20)">
    <circle cx="70" cy="70" r="50" fill="#0f766e" />
    <circle cx="70" cy="70" r="30" fill="#0f0f1a" />
    
    <!-- Left Circle: 9 -->
    <circle cx="30" cy="70" r="14" fill="#1a1a2e" />
    <text x="30" cy="76" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
    
    <!-- Right Circle: 2 -->
    <circle cx="100" cy="70" r="14" fill="#1a1a2e" />
    <circle cx="100" cy="70" r="12" fill="#374151" />
    <text x="100" cy="76" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    
    <!-- Center Circle: 11 -->
    <circle cx="70" cy="70" r="20" fill="#0f766e" />
    <circle cx="70" cy="70" r="16" fill="#14535d" />
    <text x="70" cy="78" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">11</text>
    
    <!-- Smile Curve -->
    <path d="M 30 92 Q 70 100 110 92" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" />
    
    <!-- Bottom Base Bar -->
    <rect x="25" y="125" width="60" height="10" rx="5" fill="#0f766e" />
    <ellipse cx="70" cy="132" rx="25" ry="7" fill="#0b4f59" />
    
    <!-- Shine -->
    <path d="M 35 50 Q 70 30 105 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Typography: Campus -->
  <text x="220" y="132" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="-4">Campus</text>

  <!-- Typography: Pilot -->
  <text x="550" y="132" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#ec4899" letter-spacing="-4">Pilot</text>

  <!-- Tagline -->
  <text x="220" y="192" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" letter-spacing="0.5">Your Campus Assistant</text>
</svg>
