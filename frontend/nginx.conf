# Frontend nginx config
# Serves the React app and proxies API calls to the backend.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Static assets with long cache.
    #
    # This is a *regex* location, so it takes precedence over the prefix
    # locations below. Anything with a real file extension on disk is served
    # from disk and never reaches the backend.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: serve a real file if one exists, otherwise treat the
    # request as an API call.
    #
    # This used to be thirteen hand-written `location /prefix/` blocks with
    # duplicated proxy headers, one per backend router. That design fails
    # silently and specifically: adding a backend router and forgetting this
    # file produces a 404 from the SPA origin that looks exactly like the
    # endpoint being missing, and only shows up in the deployed container -
    # the Vite dev server has its own separate copy of the same list. The
    # Web App / Android Monitoring sections were added without updating this
    # file, and every /monitoring and /collect request 404'd.
    #
    # try_files checks the filesystem first, so the single-page app still
    # works: / and any client-side route resolve to index.html, and anything
    # with no file on disk falls through to the backend. New backend routers now
    # need no change here at all.
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The monitoring dashboard is a handful of parallel JSON requests plus a
        # possible manual rollup rebuild. Default nginx behaviour is fine, but
        # the rollup scans raw events, so it gets a longer budget than a page
        # render would ever need.
        proxy_read_timeout 120s;
    }
}