# CampusPilot - the production stack
# Usage: docker compose up --build
#
# Services: postgres, adminer, backend, frontend - and, with
# `--profile rollup`, the rollup worker as its own container. The default
# rolls up inline in the backend (ROLLUP_INLINE=true), so the worker is only
# for a deployment that wants the rollup off the API's own path.
#
# There are no profiles. The monitoring stack (Prometheus, Grafana,
# node_exporter, alertmanager, VictoriaLogs, cAdvisor, blackbox_exporter) was
# removed once the in-app monitoring, alerting and scan agent took over, and
# the two networks below are what it left behind: the frontend and the
# backend on the edge, everything else internal with no route out.
#
# MIGRATION FROM SQLITE:
#   1. docker compose up -d postgres
#   2. docker compose run --rm backend python -m alembic -c /app/backend/alembic.ini upgrade head
#   3. docker compose run --rm backend python scripts/data/migrate_sqlite_to_postgres.py \
#        --source /app/database/classpilot.db --dry-run
#   4. drop the --dry-run and run it for real
#   5. docker compose up -d

services:
  # ================================================================
  # Core Infrastructure
  # ================================================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuspilot}
      POSTGRES_DB: ${POSTGRES_DB:-campuspilot}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuspilot} -d ${POSTGRES_DB:-campuspilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=1GB
      - -c
      - random_page_cost=1.1
    # The database has no route to the internet: it is only on the internal
    # network. The published port is for the host (migrations, psql), not for
    # other machines.
    networks:
      - app-internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Reaches the database on the internal network only; no route out.
    networks:
      - app-internal

  # ================================================================
  # Application Services
  # ================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8001"
    environment:
      # The signing key for every token the app issues. There is no default
      # on purpose: the fallback that used to be here is in this repository's
      # history, so a deployment that forgot to set one would sign its admin
      # tokens with a published key. Docker refuses to start without it.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env - copy .env.example and generate one with "python -c \"import secrets; print(secrets.token_urlsafe(48))\""}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-campuspilot}:${POSTGRES_PASSWORD:-campuspilot}@postgres:5432/${POSTGRES_DB:-campuspilot}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=1800
      - ALLOWED_EMAIL_DOMAIN=@iiitdmj.ac.in
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=noreply@iiitdmj.ac.in
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - TIMEZONE=Asia/Kolkata
      - COLLEGE_START=09:00
      - COLLEGE_END=17:00
      - LUNCH_START=13:00
      - LUNCH_END=14:00
      - ATTENDANCE_SAFE=75
      - ATTENDANCE_WARNING=65
      - MAX_UPLOAD_MB=25
      - ALLOWED_EXTENSIONS=.pdf,.csv
      - BRANCH_OPTIONS=CSE A,CSE B,DS,ECE,ME,SM,PG,MDes
      - ADMISSION_YEAR=21
      # Monitoring / observability
      - TELEMETRY_PEPPER=${TELEMETRY_PEPPER:-}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - TELEMETRY_MAX_BATCH=100
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - ROLLUP_INLINE=${ROLLUP_INLINE:-true}
      - SCAN_ENABLED=${SCAN_ENABLED:-false}
      - SCAN_LLM_ENABLED=${SCAN_LLM_ENABLED:-false}
      - SCAN_UPTIME_FLOOR_PCT=${SCAN_UPTIME_FLOOR_PCT:-99.0}
      - ENABLE_STORE_VERIFY=${ENABLE_STORE_VERIFY:-false}
      # Alerting
      - ALERT_TELEGRAM_BOT_TOKEN=${ALERT_TELEGRAM_BOT_TOKEN:-}
      - ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # LLM (any OpenAI-compatible endpoint)
      - LLM_PROVIDER=${LLM_PROVIDER:-off}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-240}
      # OppFeed Agent
      - ENABLE_AGENT=${ENABLE_AGENT:-false}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-false}
      - ENABLE_VISION=${ENABLE_VISION:-false}
      - ENABLE_BANNER_GEN=${ENABLE_BANNER_GEN:-false}
      - ENABLE_AUDIO_SUMMARY=${ENABLE_AUDIO_SUMMARY:-false}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # The optional admin MCP console. Off by default: with the flag false
      # the endpoint is not mounted at all.
      - ENABLE_ADMIN_MCP=${ENABLE_ADMIN_MCP:-false}
      # Read-only telemetry access for anything that only analyses: the
      # `monitoring_ro` role can SELECT the telemetry tables and nothing
      # else. Left empty on purpose - only a sidecar that needs it should
      # carry it.
      - MONITORING_RO_URL=${MONITORING_RO_URL:-}
    volumes:
      - database:/app/database
      - ./backend/app/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # The backend is the only service with a route out: SMTP and the single
    # permitted egress path (the LLM provider call). Everything else it
    # talks to lives on the internal network.
    networks:
      - edge
      - app-internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # The public face: on the edge, and on nothing else.
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ================================================================
  # In-app rollup worker
  #
  # The hourly rollup and retention prune, run in their own process so
  # they cannot compete with request handling. It reads the in-app
  # event stores directly - there is no external metrics server to
  # query any more.

  rollup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["lite", "full", "rollup"]
    command: python -m features.monitoring.rollup --loop --prune
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-campuspilot}:${POSTGRES_PASSWORD:-campuspilot}@postgres:5432/${POSTGRES_DB:-campuspilot}
      - ROLLUP_INTERVAL_HOURS=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Internal only: no route out of the compose network, and not
    # on the edge network either.
    networks:
      - app-internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ================================================================
  # Networks
  # ================================================================
# Two networks, and the difference is the point:
#
#   edge         - the only network with a route to the internet. The
#                  frontend and the backend live here; the backend needs it
#                  for SMTP and for the one permitted egress path (the LLM
#                  provider call).
#   app-internal - `internal: true`, so no container on it can reach
#                  anything outside the compose network. The database, the
#                  rollup worker and the whole monitoring stack live here.
#
# A container that is only on app-internal has no internet access at all: a
# scrape, a rollout or a compromise inside it cannot call out.
networks:
  edge:
    name: campuspilot-edge
    driver: bridge
  app-internal:
    name: campuspilot-internal
    driver: bridge
    internal: true

# ================================================================
# Volumes
# ================================================================
volumes:
  postgres_data:
  database:
  uploads:
