# Alerting rules.
#
# These are deliberately few. An alert set nobody trusts is worse than none,
# because it teaches people to ignore the channel - and the cheapest way to get
# there is twenty rules that fire on ordinary behaviour.
#
# Every rule below fires on a condition an on-call person can act on at 3am
# without needing context. Anything more speculative belongs in a dashboard,
# not in this file.
#
# The severities map onto the three states the UI already understands:
#   critical -> Critical   warning -> Warning   info -> informational only

groups:
  - name: campuspilot-availability
    rules:
      - alert: ApiDown
        expr: up{job="campuspilot-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The CampusPilot API is not answering /metrics"
          description: >-
            Prometheus has failed to scrape the API for 2 minutes. Either the
            process is down or /metrics is returning an error. Students cannot
            log in.

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is not scraping itself"
          description: >-
            Monitoring has stopped collecting. Nothing else in this file will
            fire, so treat every other alert as unverified until this is fixed.

  - name: campuspilot-telemetry
    rules:
      # This is the rule that catches the most embarrassing failure mode: the
      # dashboards look perfectly healthy because they are confidently
      # reporting zero rows, and nobody notices for weeks.
      - alert: TelemetryCollectorStalled
        expr: absent(campuspilot_collector_events_total)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No telemetry events have been accepted"
          description: >-
            The /collect/events endpoint has accepted nothing for 30 minutes.
            The monitoring dashboards will show zeros rather than an error, so
            they look healthy while being meaningless.

      - alert: DatabaseUnreachable
        expr: absent(campuspilot_http_requests_total)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The API is up but serving nothing"
          description: >-
            The request counter has no samples. The process is running but
            every request is failing before it reaches a handler - usually a
            database connection failure at startup.

  - name: campuspilot-capacity
    rules:
      # Saturation, not usage. A host at 85% memory is normal; a host that has
      # been above 85% memory for ten minutes and is still climbing is a page.
      - alert: HostMemoryPressure
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 85% for 10 minutes"

      - alert: HostDiskWillFillSoon
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk is projected to fill within 24 hours"
          description: >-
            Extrapolated from the last 6 hours. On this deployment the usual
            cause is the Prometheus TSDB rather than application logs.

      - alert: HostCpuSustained
        expr: |
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for 15 minutes"

  - name: campuspilot-web-health
    rules:
      - alert: WebHighLatency
        expr: |
          histogram_quantile(0.95, rate(campuspilot_http_request_duration_seconds_bucket{job="campuspilot-api"}[5m])) > 2
        for: 5m
        labels:
          severity: critical
          subsection: A_W_HEALTH
        annotations:
          summary: "Web API p95 latency above 2s"
          description: "p95 latency {{ $value | humanizeDuration }} sustained for 5 minutes"

      - alert: WebHighErrorRate
        expr: |
          sum(rate(campuspilot_http_requests_total{job="campuspilot-api",status=~"5.."}[5m])) 
          / sum(rate(campuspilot_http_requests_total{job="campuspilot-api"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          subsection: A_W_HEALTH
        annotations:
          summary: "Web API 5xx error rate above 5%"
          description: "5xx rate {{ $value | humanizePercentage }} sustained for 2 minutes"

      - alert: WebSlowEndpoints
        expr: |
          histogram_quantile(0.95, rate(campuspilot_http_request_duration_seconds_bucket{job="campuspilot-api"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          subsection: A_W_HEALTH
        annotations:
          summary: "Web API p95 latency above 1s"
          description: "p95 latency {{ $value | humanizeDuration }} sustained for 5 minutes"

      - alert: WebLowUptime
        expr: |
          up{job="campuspilot-api"} == 0
        for: 2m
        labels:
          severity: critical
          subsection: A_W_HEALTH
        annotations:
          summary: "Web API down"
          description: "API /health endpoint returning non-200"

      - alert: WebHighDatabaseLatency
        expr: |
          histogram_quantile(0.95, rate(campuspilot_db_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          subsection: A_W_HEALTH
        annotations:
          summary: "Database p95 latency above 500ms"
          description: "DB query p95 {{ $value | humanizeDuration }} sustained"

      - alert: WebSslExpiringSoon
        expr: |
          campuspilot_ssl_expiry_days < 14
        for: 1h
        labels:
          severity: warning
          subsection: A_W_HEALTH
        annotations:
          summary: "SSL certificate expiring within 14 days"
          description: "Certificate expires in {{ $value }} days"

  - name: campuspilot-web-activity
    rules:
      - alert: WebDauDrop
        expr: |
          (campuspilot_active_users_web - campuspilot_active_users_web_prev) / campuspilot_active_users_web_prev < -0.4
        for: 15m
        labels:
          severity: critical
          subsection: B_W_ACTIVITY
        annotations:
          summary: "Web DAU dropped more than 40% vs previous period"

      - alert: WebRevenueDrop
        expr: |
          (campuspilot_revenue_verified_micros_web - campuspilot_revenue_verified_micros_web_prev) / campuspilot_revenue_verified_micros_web_prev < -0.3
        for: 1h
        labels:
          severity: critical
          subsection: B_W_ACTIVITY
        annotations:
          summary: "Web verified revenue dropped more than 30%"

      - alert: WebRetentionLow
        expr: |
          campuspilot_retention_day1_pct_web < 20
        for: 1h
        labels:
          severity: warning
          subsection: B_W_ACTIVITY
        annotations:
          summary: "Web day-1 retention below 20%"

  - name: campuspilot-web-security
    rules:
      - alert: WebFailedLoginsSpike
        expr: |
          rate(campuspilot_security_events_total{kind="failed_login",platform="web"}[5m]) * 3600 > 100
        for: 5m
        labels:
          severity: warning
          subsection: C_W_SECURITY
        annotations:
          summary: "Web failed logins above 100/hour"

      - alert: WebBruteForce
        expr: |
          rate(campuspilot_security_events_total{kind="failed_login",platform="web"}[5m]) * 3600 > 1000
        for: 5m
        labels:
          severity: critical
          subsection: C_W_SECURITY
        annotations:
          summary: "Web brute force attack detected (>1000/h from single IP)"

      - alert: WebRateLimited
        expr: |
          rate(campuspilot_security_events_total{kind="rate_limited",platform="web"}[5m]) * 3600 > 100
        for: 5m
        labels:
          severity: warning
          subsection: C_W_SECURITY
        annotations:
          summary: "Web rate limit hits above 100/hour"

      - alert: WebCriticalCve
        expr: |
          campuspilot_dependency_vulnerability_critical > 0
        for: 1h
        labels:
          severity: critical
          subsection: C_W_SECURITY
        annotations:
          summary: "Critical CVE found in dependencies"

      - alert: WebSecurityHeadersDegraded
        expr: |
          campuspilot_security_header_score < 60
        for: 1h
        labels:
          severity: warning
          subsection: C_W_SECURITY
        annotations:
          summary: "Security headers score below 60"

  - name: campuspilot-web-feedback
    rules:
      - alert: WebFeedbackVolumeDrop
        expr: |
          (campuspilot_feedback_total_web - campuspilot_feedback_total_web_prev) / campuspilot_feedback_total_web_prev < -0.5
        for: 1h
        labels:
          severity: critical
          subsection: D_W_FEEDBACK
        annotations:
          summary: "Web feedback volume dropped more than 50%"

      - alert: WebFeedbackNegativeSentiment
        expr: |
          campuspilot_feedback_sentiment_mean_web < -0.2
        for: 1h
        labels:
          severity: warning
          subsection: D_W_FEEDBACK
        annotations:
          summary: "Web feedback sentiment turned negative"

      - alert: WebFeedbackComplaintCluster
        expr: |
          campuspilot_feedback_top_complaint_count_web >= 20
        for: 1h
        labels:
          severity: critical
          subsection: D_W_FEEDBACK
        annotations:
          summary: "Web feedback complaint cluster detected (>= 20 similar complaints)"

  - name: campuspilot-android-health
    rules:
      - alert: AndroidCrashFreeRateLow
        expr: |
          campuspilot_crash_free_rate_pct_android < 99
        for: 15m
        labels:
          severity: critical
          subsection: A_A_HEALTH
        annotations:
          summary: "Android crash-free rate below 99%"

      - alert: AndroidAnrRateHigh
        expr: |
          campuspilot_anr_rate_pct_android > 2
        for: 15m
        labels:
          severity: critical
          subsection: A_A_HEALTH
        annotations:
          summary: "Android ANR rate above 2%"

      - alert: AndroidStartupSlow
        expr: |
          campuspilot_startup_time_ms_android > 5000
        for: 15m
        labels:
          severity: warning
          subsection: A_A_HEALTH
        annotations:
          summary: "Android cold start time above 5s"

      - alert: AndroidSlowFrames
        expr: |
          campuspilot_slow_frames_pct_android > 25
        for: 15m
        labels:
          severity: warning
          subsection: A_A_HEALTH
        annotations:
          summary: "Android slow frames above 25%"

  - name: campuspilot-android-activity
    rules:
      - alert: AndroidDauDrop
        expr: |
          (campuspilot_active_users_android - campuspilot_active_users_android_prev) / campuspilot_active_users_android_prev < -0.4
        for: 15m
        labels:
          severity: critical
          subsection: B_A_ACTIVITY
        annotations:
          summary: "Android DAU dropped more than 40%"

      - alert: AndroidIapRevenueDrop
        expr: |
          (campuspilot_iap_revenue_micros_android - campuspilot_iap_revenue_micros_android_prev) / campuspilot_iap_revenue_micros_android_prev < -0.3
        for: 1h
        labels:
          severity: critical
          subsection: B_A_ACTIVITY
        annotations:
          summary: "Android IAP revenue dropped more than 30%"

  - name: campuspilot-android-security
    rules:
      - alert: AndroidRootDetected
        expr: |
          rate(campuspilot_security_events_total{kind="root_detected",platform="android"}[5m]) * 3600 > 5
        for: 5m
        labels:
          severity: warning
          subsection: C_A_SECURITY
        annotations:
          summary: "Android root detection signals above 5/hour"

      - alert: AndroidEmulatorDetected
        expr: |
          rate(campuspilot_security_events_total{kind="emulator_detected",platform="android"}[5m]) * 3600 > 5
        for: 5m
        labels:
          severity: warning
          subsection: C_A_SECURITY
        annotations:
          summary: "Android emulator detection signals above 5/hour"

      - alert: AndroidTamperDetected
        expr: |
          rate(campuspilot_security_events_total{kind="tamper_detected",platform="android"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          subsection: C_A_SECURITY
        annotations:
          summary: "Android tampering detected"

      - alert: AndroidTokenMisuse
        expr: |
          campuspilot_security_events_total{kind="token_misuse",platform="android"} >= 3
        for: 5m
        labels:
          severity: critical
          subsection: C_A_SECURITY
        annotations:
          summary: "Android token misuse events >= 3"

      - alert: AndroidReplayAttack
        expr: |
          campuspilot_security_events_total{kind="replay_attack",platform="android"} > 0
        for: 1m
        labels:
          severity: critical
          subsection: C_A_SECURITY
        annotations:
          summary: "Android replay attack confirmed"

  - name: campuspilot-android-feedback
    rules:
      - alert: AndroidFeedbackVolumeDrop
        expr: |
          (campuspilot_feedback_total_android - campuspilot_feedback_total_android_prev) / campuspilot_feedback_total_android_prev < -0.5
        for: 1h
        labels:
          severity: critical
          subsection: D_A_FEEDBACK
        annotations:
          summary: "Android feedback volume dropped more than 50%"

      - alert: AndroidFeedbackCrashCorrelation
        expr: |
          campuspilot_feedback_crash_correlation_crash_complaint_count_android >= 10
        for: 1h
        labels:
          severity: critical
          subsection: D_A_FEEDBACK
        annotations:
          summary: "Android feedback mentions crash cluster (>= 10 complaints)"