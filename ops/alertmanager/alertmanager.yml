# Alertmanager configuration for CampusPilot
# Routes alerts from Prometheus to notification receivers

global:
  resolve_timeout: 5m

# Inhibit rules to avoid notification spam
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Notification routes
route:
  group_by: ['alertname', 'subsection']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts go immediately to all receivers
    - match:
        severity: 'critical'
      receiver: 'critical-alerts'
      continue: true
    # Security alerts to security team
    - match_re:
        alertname: '.*Security.*|.*Auth.*|.*BruteForce.*'
      receiver: 'security-alerts'
    # Web health alerts
    - match_re:
        alertname: '.*Health.*|.*Latency.*|.*ErrorRate.*'
      receiver: 'web-health-alerts'
    # Android health alerts
    - match_re:
        alertname: '.*Android.*|.*Crash.*|.*ANR.*'
      receiver: 'android-alerts'

receivers:
  - name: 'default'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: '${ALERT_TELEGRAM_CHAT_ID}'
        message: |
          {{ range .Alerts }}
          [{{ .Status }}] {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          Subsection: {{ .Labels.subsection }}
          {{ end }}
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: 'critical-alerts'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: '${ALERT_TELEGRAM_CHAT_ID}'
        message: |
          🚨 CRITICAL: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        parse_mode: HTML
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: 'security-alerts'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: '${ALERT_TELEGRAM_CHAT_ID}'
        message: |
          🔒 SECURITY: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: 'web-health-alerts'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: '${ALERT_TELEGRAM_CHAT_ID}'
        message: |
          🏥 WEB HEALTH: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: 'android-alerts'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: '${ALERT_TELEGRAM_CHAT_ID}'
        message: |
          📱 ANDROID: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true