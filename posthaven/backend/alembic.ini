[alembic]
# path to migration scripts
script_location = alembic

# database url (overridden by env at runtime)
sqlalchemy.url = sqlite:///./posthaven.db

# version location
version_locations = alembic/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version table name
version_table = alembic_version

[postwrite_hooks]
# hook for running black on new migration files
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 %(filename)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
