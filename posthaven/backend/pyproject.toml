[project]
name = "posthaven-backend"
version = "0.1.0"
description = "PostHaven mail backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.1",
    "sqlmodel==0.0.23",
    "asyncpg==0.29.0",
    "pydantic-settings==2.4.0",
    "alembic==1.13.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "bcrypt==4.1.2",
    "cryptography==43.0.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib==1.0.0",
    "nh3==0.2.14",
    "selectolax==0.3.15",
    "redis>=4.2,<6",
    "arq[redis]==0.26.0",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "psycopg2-binary==2.9.9",
    "httpx==0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "B", "C4", "UP", "PIE", "PERF", "TRY", "RUF", "PD"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
exclude = ["alembic", ".venv"]
