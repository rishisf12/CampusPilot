name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run tests
        run: |
          python -m pytest --tb=short -q

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/backend/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install eslint
        run: |
          cd frontend
          npm ci
          npx eslint --version || npm install -D eslint

      - name: Lint JavaScript/React
        run: |
          cd frontend
          npx eslint src/ --ext .js,.jsx || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t campuspilot-backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: |
          docker build -t campuspilot-frontend:latest -f frontend/Dockerfile frontend/

      # Uncomment and configure for registry push:
      # - name: Log in to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push images
      #   run: |
      #     docker tag campuspilot-backend:latest ghcr.io/${{ github.repository }}/backend:latest
      #     docker tag campuspilot-frontend:latest ghcr.io/${{ github.repository }}/frontend:latest
      #     docker push ghcr.io/${{ github.repository }}/backend:latest
      #     docker push ghcr.io/${{ github.repository }}/frontend:latest