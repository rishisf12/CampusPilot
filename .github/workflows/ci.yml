name: CI Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd CampusPilot/backend
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Run ruff
        run: |
          cd CampusPilot/backend
          ruff check .
      - name: Run mypy
        run: |
          cd CampusPilot/backend
          mypy app --ignore-missing-imports || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd CampusPilot/frontend
          npm ci
      - name: Run ESLint
        run: |
          cd CampusPilot/frontend
          npm run lint
      - name: Run TypeScript check
        run: |
          cd CampusPilot/frontend
          npx tsc --noEmit
      - name: Run Prettier
        run: |
          cd CampusPilot/frontend
          npm run format -- --check

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campuspilot
          POSTGRES_PASSWORD: campuspilot
          POSTGRES_DB: campuspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd CampusPilot/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run migrations
        run: |
          cd CampusPilot/backend
          TEST_DATABASE_URL=postgresql+psycopg://campuspilot:campuspilot@localhost:5432/campuspilot_test \
          python -m alembic -c alembic.ini upgrade heads
      - name: Run tests
        run: |
          cd CampusPilot/backend/app
          TEST_DATABASE_URL=postgresql+psycopg://campuspilot:campuspilot@localhost:5432/campuspilot_test \
          python -m pytest tests/ -p no:cacheprovider --tb=short -q --maxfail=5

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd CampusPilot/frontend
          npm ci
      - name: Run tests
        run: |
          cd CampusPilot/frontend
          npm run test -- --watchAll=false

  enforce-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check monitoring wrappers
        run: |
          # Check that all new API routes use monitoring middleware
          grep -r "from core.monitoring import" CampusPilot/backend/app/features/ --include="*.py" | wc -l
          # Check that all React components have ErrorBoundary
          grep -r "ErrorBoundary" CampusPilot/frontend/src/modules --include="*.tsx" | wc -l
          # Check that API calls use adminApi wrapper
          grep -r "adminApi\." CampusPilot/frontend/src/modules/admin --include="*.tsx" | wc -l

  enforce-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check API documentation
        run: |
          # Check that all admin endpoints have docstrings
          grep -r "@router\." CampusPilot/backend/app/features --include="*.py" -A 2 | grep -c '"""' || echo "Missing docstrings"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build frontend
        run: |
          cd CampusPilot/frontend
          npm ci
          npm run build
      - name: Build backend
        run: |
          cd CampusPilot/backend
          pip install -r requirements.txt
          python -m py_compile app/main.py

  notify:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint, backend-tests, frontend-tests, enforce-monitoring, enforce-api-docs, build]
    if: failure()
    steps:
      - name: Notify on failure
        run: echo "CI failed - check workflow logs"