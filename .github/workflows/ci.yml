name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-test:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run tests
        run: |
          python -m pytest --tb=short -q

  backend-test-postgres:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/backend
    # This is the job that gates the merge for database changes. SQLite is
    # permissive where PostgreSQL is not - it will store NULL in a NOT NULL
    # column, it will not enforce a unique index added to an existing table, and
    # it compares LIKE case-insensitively - so a suite that only runs on SQLite
    # cannot catch a migration that breaks production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuspilot
          POSTGRES_PASSWORD: campuspilot
          POSTGRES_DB: campuspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuspilot -d campuspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://campuspilot:campuspilot@localhost:5432/campuspilot_test
        run: |
          python -m pytest --tb=short -q

      - name: Alembic downgrade/upgrade round-trips
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://campuspilot:campuspilot@localhost:5432/campuspilot_test
        run: |
          # Autogenerate's downgrade left the `attendancestatus` enum type
          # behind, so the second upgrade failed with DuplicateObject. Proving
          # the cycle works twice, in CI, is cheaper than finding out during a
          # production rollback.
          for i in 1 2; do
            python -m alembic -c alembic.ini upgrade head
            python -m alembic -c alembic.ini downgrade base
          done
          python -m alembic -c alembic.ini upgrade head

      - name: Verify no drift between models and migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://campuspilot:campuspilot@localhost:5432/campuspilot_test
        run: |
          # If a model changed without a migration, autogenerate finds a diff.
          # Failing here means the two have drifted and production would not get
          # the change.
          python -m alembic -c alembic.ini check

      - name: Validate Prometheus config and rules
        run: |
          # A Prometheus config that does not parse means the monitoring stack
          # silently does not start, which is the failure mode this whole
          # project is meant to prevent. Validating it in CI costs about twenty
          # seconds and catches a missing rule file or a renamed metric before
          # anyone discovers it at 3am.
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate docker-compose
        run: docker compose --profile monitoring --profile monitoring-full --profile rollup config --quiet

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/backend/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install eslint
        run: |
          cd frontend
          npm ci
          npx eslint --version || npm install -D eslint

      - name: Lint JavaScript/React
        run: |
          cd frontend
          npx eslint src/ --ext .js,.jsx || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, backend-test-postgres, frontend-test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t campuspilot-backend:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: |
          docker build -t campuspilot-frontend:latest -f frontend/Dockerfile frontend/

      # Uncomment and configure for registry push:
      # - name: Log in to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push images
      #   run: |
      #     docker tag campuspilot-backend:latest ghcr.io/${{ github.repository }}/backend:latest
      #     docker tag campuspilot-frontend:latest ghcr.io/${{ github.repository }}/frontend:latest
      #     docker push ghcr.io/${{ github.repository }}/backend:latest
      #     docker push ghcr.io/${{ github.repository }}/frontend:latest