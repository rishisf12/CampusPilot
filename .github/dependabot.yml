# CampusPilot — Dependabot Configuration
# Weekly dependency updates for security and maintenance

version: 2
updates:
  # Python dependencies (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "python"
      - "backend"
    commit-message:
      prefix: "[backend]"
      prefix-development: "[backend][dev]"
    open-pull-requests-limit: 10

  # Python dependencies (tools)
  - package-ecosystem: "pip"
    directory: "/backend/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "python"
      - "backend"
    commit-message:
      prefix: "[backend/tools]"
      prefix-development: "[backend/tools][dev]"
    open-pull-requests-limit: 10

  # Node.js dependencies (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "nodejs"
      - "frontend"
    commit-message:
      prefix: "[frontend]"
      prefix-development: "[frontend][dev]"
    open-pull-requests-limit: 10

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[docker]"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[actions]"
    open-pull-requests-limit: 5