# Timetable Processor Configuration
# Reusable for any semester's timetable PDF (Aug-Nov 2026, Jan-Apr 2027, etc.)

source:
  pdf_path: "input/timetable_latest.pdf"
  version: "Version III"
  effective_date: "2026-08-17"
  updated_date: "2026-08-14"
  semester_label: "Aug-Nov 2026"

parsing:
  # Time slot column headers as they appear in the PDF
  time_slots:
    - "08:00-08:55"
    - "09:00-09:55"
    - "10:00-10:55"
    - "11:00-11:55"
    - "12:00-12:55"
    - "14:00-14:55"
    - "15:00-15:55"
    - "16:00-16:55"
    - "17:00-17:55"

  # Semester bands in the PDF
  semesters:
    - "I"
    - "III"
    - "V"
    - "VII"
    - "PG"

# Branch configuration per semester
# group_code: the letter/number shown in the PDF's second column
branches:
  I:
    - name: "CSE"
      groups: ["A", "B"]
    - name: "ECE"
      groups: ["C"]
    - name: "ME"
      groups: ["D1"]
    - name: "SM"
      groups: ["D2"]
    - name: "DS"
      groups: ["E1", "E2"]
  III:
    - name: "CSE"
      groups: ["A", "B"]
    - name: "ECE"
      groups: ["C"]
    - name: "ME"
      groups: ["D1"]
    - name: "SM"
      groups: ["D1", "D2"]
    - name: "DS"
      groups: ["E"]
  V:
    - name: "CSE"
      groups: ["A", "B"]
    - name: "ECE"
      groups: ["C"]
    - name: "ME"
      groups: ["D1"]
    - name: "SM"
      groups: ["D2"]
    - name: "DS"
      groups: ["E"]
  VII:
    - name: "CSE"
      groups: [""]
    - name: "ECE"
      groups: [""]
    - name: "ME"
      groups: [""]
    - name: "SM"
      groups: [""]
    - name: "DS"
      groups: [""]
  PG:
    - name: "M.Tech (AI)"
      groups: [""]
    - name: "M.Tech (DS)"
      groups: [""]
    - name: "Ph.D. (CSE)"
      groups: [""]
    - name: "M.Tech (P&C)"
      groups: [""]
    - name: "M.Tech (Nano)"
      groups: [""]
    - name: "M.Tech (Design)"
      groups: [""]
    - name: "M.Tech (Mechtronics)"
      groups: [""]
    - name: "Ph.D. (ME)"
      groups: [""]
    - name: "MDes (Sem I)"
      groups: [""]
    - name: "MDes (Sem III)"
      groups: [""]
    - name: "Ph.D. (NS)"
      groups: [""]

