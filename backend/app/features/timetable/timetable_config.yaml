# Output configuration
output:
  formats: ["excel", "json"]
  output_dir: "output/"
  excel_filename: "Timetable_Aug-Nov_2026_by_Semester_Branch.xlsx"
  json_filename: "timetable.json"
  sheet_naming:
    btech_pattern: "{semester_roman}-{branch_name}"
    pg_pattern: "PG-{branch_name}"

# Validation rules
validation:
  check_room_conflicts: true
  check_instructor_conflicts: true
  allowed_time_gaps: 1