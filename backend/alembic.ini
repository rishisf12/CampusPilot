# Alembic configuration for CampusPilot.
#
# Note the absence of sqlalchemy.url. The URL carries a database password and
# belongs in the environment, not in a committed file; alembic/env.py reads it
# from core.config.settings instead. Leaving it blank here is deliberate.
#
# script_location is resolved absolutely in core/database.alembic_config() so
# that migrations work regardless of the working directory the command is run
# from (the Dockerfile, a laptop shell, and CI all differ).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, sortable filenames. The 0001_ prefix on the initial revision
# keeps it first even though autogenerate names them by timestamp.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# --- Logging -------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S